apply plugin: 'com.android.application'

def verifyOnly = providers.gradleProperty('androidVerifyOnly').orElse('false').get().toBoolean()

android {
    namespace "com.ylports.supermetroid"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"
    defaultConfig {
        applicationId "com.ylports.supermetroid"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0-alpha1"
        buildConfigField 'boolean', 'ENGINE_COMPILED', "${!verifyOnly}"
        if (verifyOnly) applicationIdSuffix '.buildcheck'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DSNESRECOMP_SETUP_HOST=${verifyOnly ? 'ON' : 'OFF'}",
                          "-DSNESRECOMP_ENABLE_TRACE=OFF",
                          "-DSNESRECOMP_ENABLE_FRAME_FINGERPRINTS=OFF",
                          "-DSNESRECOMP_ENABLE_PPU_DMA_HISTORY=OFF",
                          "-DSNESRECOMP_BUILD_VERSION=android-0.1.0-alpha1",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('SM_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('SM_ANDROID_KEYSTORE'))
                storePassword System.getenv('SM_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('SM_ANDROID_KEY_ALIAS') ?: 'supermetroid'
                keyPassword System.getenv('SM_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (System.getenv('SM_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    packaging { jniLibs { useLegacyPackaging false } }
    // SDL's Java glue (org.libsdl.app) is copied from the pinned SDL2 source
    // release by android/fetch_sdl.sh and must version-match jni/SDL.
    lint {
        lintConfig file('../lint.xml')
        abortOnError true
    }
}
